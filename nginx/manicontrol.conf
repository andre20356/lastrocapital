server {
    listen 80;
    server_name manicontrol.online www.manicontrol.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://manicontrol.online$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.manicontrol.online;

    ssl_certificate     /etc/nginx/ssl/manicontrol/live/manicontrol.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/manicontrol/live/manicontrol.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 301 https://manicontrol.online$request_uri;
}

server {
    listen 443 ssl;
    server_name manicontrol.online;

    ssl_certificate     /etc/nginx/ssl/manicontrol/live/manicontrol.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/manicontrol/live/manicontrol.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — força HTTPS em todos os browsers por 1 ano
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass         http://172.16.1.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
