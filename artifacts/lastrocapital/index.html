    <!-- Fix: aplica background ANTES de qualquer render para evitar flash preto no iOS Safari -->
    <script>
      (function () {
        var stored = localStorage.getItem("lc-theme-v2");
        var isDark = stored === "dark";
        // light: hsl(210 20% 98%) | dark: hsl(220 18% 10%)
        document.documentElement.style.background = isDark ? "hsl(220,18%,10%)" : "hsl(210,20%,98%)";
        document.body && (document.body.style.background = isDark ? "hsl(220,18%,10%)" : "hsl(210,20%,98%)");
      })();
    </script>
